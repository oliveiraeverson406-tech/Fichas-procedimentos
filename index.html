<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Procedimentos - e-SUS AB</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B5CAB">
<style>
  :root{
    --azul:#0B5CAB;
    --azul-claro:#EAF3FC;
    --azul-escuro:#083D73;
    --borda:#C7D6E5;
    --texto:#1B2A38;
    --cinza:#6B7A8A;
    --verde:#1E8E5A;
    --fundo:#F4F7FA;
    --branco:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--fundo);
    color:var(--texto);
    padding-bottom:90px;
  }
  header.topo{
    background:var(--azul);
    color:#fff;
    padding:14px 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header.topo h1{
    margin:0;
    font-size:17px;
    font-weight:600;
  }
  header.topo p{
    margin:2px 0 0;
    font-size:12px;
    opacity:.85;
  }
  .container{
    max-width:720px;
    margin:0 auto;
    padding:14px;
  }
  .card{
    background:var(--branco);
    border:1px solid var(--borda);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--azul-escuro);
    margin:0 0 10px;
    border-bottom:2px solid var(--azul-claro);
    padding-bottom:6px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 10px;
  }
  .grid .full{grid-column:1/-1;}
  label{
    display:block;
    font-size:11px;
    color:var(--cinza);
    margin-bottom:3px;
    font-weight:600;
  }
  input[type=text],input[type=number]{
    width:100%;
    padding:8px 9px;
    border:1px solid var(--borda);
    border-radius:6px;
    font-size:14px;
    background:#fff;
  }
  input:focus{outline:2px solid var(--azul);outline-offset:1px;}
  .radios{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;}
  .radios label{
    display:flex;align-items:center;gap:4px;
    font-size:13px;font-weight:400;color:var(--texto);
    background:var(--azul-claro);
    padding:6px 10px;border-radius:20px;
    cursor:pointer;
  }
  .radios input{margin:0;}

  /* Navegador de atendimentos */
  .nav-atend{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:4px 2px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .nav-atend button{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:50%;
    border:2px solid var(--borda);
    background:#fff;
    font-weight:700;
    font-size:14px;
    color:var(--cinza);
    position:relative;
  }
  .nav-atend button.ativo{
    background:var(--azul);
    border-color:var(--azul);
    color:#fff;
  }
  .nav-atend button.preenchido::after{
    content:'';
    position:absolute;
    bottom:-2px;right:-2px;
    width:10px;height:10px;
    background:var(--verde);
    border-radius:50%;
    border:2px solid #fff;
  }

  fieldset{
    border:1px solid var(--borda);
    border-radius:8px;
    margin:0 0 10px;
    padding:6px 10px 10px;
  }
  legend{
    font-size:12px;
    font-weight:700;
    color:var(--azul-escuro);
    padding:0 6px;
  }
  .check-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 2px;
    border-bottom:1px solid #EEF2F6;
    font-size:13.5px;
  }
  .check-item:last-child{border-bottom:none;}
  .check-item input{width:18px;height:18px;flex:0 0 auto;}

  .barra-acoes{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--borda);
    display:flex;
    gap:8px;
    padding:10px 12px;
    z-index:30;
    box-shadow:0 -2px 8px rgba(0,0,0,.08);
  }
  .barra-acoes button{
    flex:1;
    padding:11px 2px;
    border:none;
    border-radius:8px;
    font-size:11.5px;
    font-weight:700;
    color:#fff;
  }
  .btn-salvar{background:#0B5CAB;}
  .btn-excel{background:#1E8E5A;}
  .btn-pdf{background:#B3261E;}
  .btn-tela{background:var(--azul-escuro);}
  .btn-limpar{background:#6B7A8A;}

  #avisoSalvo{
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1E8E5A;
    color:#fff;
    padding:9px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transition:opacity .25s, transform .25s;
    z-index:40;
    pointer-events:none;
  }
  #avisoSalvo.mostrar{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .status{
    text-align:center;
    font-size:11px;
    color:var(--cinza);
    margin-top:-6px;
    margin-bottom:10px;
  }

  .totais-grupo{margin-bottom:10px;}
  .totais-grupo h3{
    font-size:12px;
    color:var(--azul-escuro);
    margin:0 0 4px;
  }
  .totais-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 2px;
    border-bottom:1px solid #EEF2F6;
    font-size:13px;
  }
  .totais-item:last-child{border-bottom:none;}
  .totais-item .qtd{
    font-weight:700;
    color:var(--azul);
    background:var(--azul-claro);
    padding:2px 10px;
    border-radius:12px;
    min-width:28px;
    text-align:center;
  }
  .totais-item .qtd.zero{color:var(--cinza);background:#F0F3F6;}

  .historico-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:9px 4px;
    border-bottom:1px solid #EEF2F6;
  }
  .historico-item:last-child{border-bottom:none;}
  .historico-info{font-size:13px;line-height:1.4;}
  .historico-info b{color:var(--azul-escuro);}
  .historico-acoes{display:flex;gap:6px;flex:0 0 auto;}
  .historico-acoes button{
    border:none;
    border-radius:6px;
    padding:7px 10px;
    font-size:12px;
    font-weight:700;
    color:#fff;
  }
  .btn-abrir{background:var(--azul);}
  .btn-excluir{background:#B3261E;}
  .historico-vazio{
    font-size:13px;
    color:var(--cinza);
    padding:6px 2px;
  }

  /* Área de impressão / PDF */
  #areaImpressao{display:none;}
  @media print{
    body *{visibility:hidden;}
    #areaImpressao, #areaImpressao *{visibility:visible;}
    #areaImpressao{display:block;position:absolute;top:0;left:0;width:100%;}
    table{width:100%;border-collapse:collapse;font-size:9px;}
    th,td{border:1px solid #333;padding:2px 3px;text-align:center;}
    th{background:#dceaf7;}
    td.rotulo{text-align:left;font-size:9px;}
  }
</style>
</head>
<body>

<header class="topo">
  <h1>Ficha de Procedimentos</h1>
  <p>e-SUS AB · Secretaria Municipal de Saúde de Barreirinha</p>
</header>

<div class="container">

  <div class="card">
    <h2>Dados da Ficha</h2>
    <div class="grid">
      <div><label>Digitado por</label><input type="text" id="digitadoPor"></div>
      <div><label>Data</label><input type="text" id="dataDigitado" placeholder="dd/mm/aaaa"></div>
      <div><label>Conferido por</label><input type="text" id="conferidoPor"></div>
      <div><label>Folha Nº</label><input type="text" id="folhaNo"></div>
      <div><label>CNS do Profissional</label><input type="text" id="cnsProfissional"></div>
      <div><label>CBO</label><input type="text" id="cbo"></div>
      <div><label>CNES</label><input type="text" id="cnes"></div>
      <div><label>INE</label><input type="text" id="ine"></div>
      <div class="full"><label>Data da Ficha</label><input type="text" id="dataFicha" placeholder="dd/mm/aaaa"></div>
    </div>
  </div>

  <div class="card">
    <h2>Atendimento</h2>
    <div class="nav-atend" id="navAtend"></div>
    <div class="status" id="statusAtend"></div>

    <div class="grid">
      <div>
        <label>Turno</label>
        <div class="radios" id="radiosTurno"></div>
      </div>
      <div><label>Nº Prontuário</label><input type="text" id="prontuario"></div>
      <div class="full"><label>CNS ou CPF do Cidadão</label><input type="text" id="documento" inputmode="numeric"></div>
      <div><label>Data de nascimento (dia/mês)</label><input type="text" id="nascDiaMes" placeholder="dd/mm"></div>
      <div><label>Ano de nascimento</label><input type="text" id="nascAno" placeholder="aaaa"></div>
      <div class="full">
        <label>Sexo</label>
        <div class="radios" id="radiosSexo"></div>
      </div>
      <div class="full"><label>Local de atendimento</label><input type="text" id="localAtendimento"></div>
    </div>

    <div class="check-item" style="margin-top:8px;">
      <input type="checkbox" id="escutaInicial">
      <span>Escuta inicial/orientação</span>
    </div>

    <div id="secoesProcedimentos"></div>
  </div>

  <div class="card">
    <h2>Totais Gerais (soma de todos os atendimentos)</h2>
    <div id="totaisLista"></div>
  </div>

  <div class="card">
    <h2>Fichas Salvas (guardadas no aplicativo)</h2>
    <div id="listaHistorico"></div>
  </div>

</div>

<div id="areaImpressao"></div>

<div class="barra-acoes">
  <button class="btn-salvar" onclick="salvarComConfirmacao()">Salvar</button>
  <button class="btn-excel" onclick="exportarExcel()">Excel</button>
  <button class="btn-pdf" onclick="gerarPDF()">PDF</button>
  <button class="btn-tela" onclick="baixarTelaAtual()">Tela</button>
  <button class="btn-limpar" onclick="limparTudo()">Limpar</button>
</div>
<div id="avisoSalvo">Dados salvos ✓</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
window.addEventListener("error", function(ev){
  const aviso = document.createElement("div");
  aviso.style.cssText = "position:fixed;top:0;left:0;right:0;background:#B3261E;color:#fff;padding:10px;font-size:12px;z-index:999;";
  aviso.textContent = "Erro no app: " + ev.message + " — tire um print disso e mande pro Claude.";
  document.body.prepend(aviso);
});

const PROCEDIMENTOS = {
  "Procedimentos/Pequenas cirurgias": [
    "Acupuntura com inserção de agulhas",
    "Administração de vitamina A",
    "Cateterismo vesical de alívio",
    "Cauterização química de pequenas lesões",
    "Cirurgia de unha (cantoplastia)",
    "Cuidado de estomas",
    "Curativo especial",
    "Drenagem de abscesso",
    "Eletrocardiograma",
    "Coleta de citopatológico de colo uterino",
    "Exame de Fundo de olho (Fundoscopia)",
    "Exame do pé diabético",
    "Exérese/biópsia/punção de tumores superficiais de pele",
    "Infiltração em cavidade sinovial",
    "Remoção de corpo estranho da cavidade auditiva e nasal",
    "Remoção de corpo estranho subcutâneo",
    "Retirada de cerume",
    "Retirada de pontos de cirurgias",
    "Sutura simples",
    "Tamponamento de epistaxe",
    "Teste do olhinho (TRV)",
    "Triagem oftalmológica"
  ],
  "Teste rápido": [
    "De gravidez",
    "Dosagem de proteinúria",
    "Para HIV",
    "Para hepatite C",
    "Para sífilis"
  ],
  "Administração de medicamentos": [
    "Oral",
    "Intramuscular",
    "Endovenosa",
    "Inalação/Nebulização",
    "Tópica",
    "Penicilina para tratamento de sífilis",
    "Subcutânea (SC)"
  ],
  "Procedimentos realizados": [
    "Verificação de pressão arterial",
    "Altura",
    "Temperatura",
    "Peso",
    "Glicemia",
    "Remoção com primeiro atendimento"
  ]
};

const CHAVE_STORAGE = "fichaProcedimentos_v1";
const CHAVE_HISTORICO = "fichaProcedimentos_historico_v1";
const TOTAL_ATENDIMENTOS = 35;

function novoAtendimento(){
  return {
    turno:"", prontuario:"", documento:"",
    nascDiaMes:"", nascAno:"", sexo:"",
    localAtendimento:"", escutaInicial:false,
    procedimentos:{}
  };
}

function estadoInicial(){
  return {
    header:{digitadoPor:"",dataDigitado:"",conferidoPor:"",folhaNo:"",cnsProfissional:"",cbo:"",cnes:"",ine:"",dataFicha:""},
    atendimentos: Array.from({length:TOTAL_ATENDIMENTOS}, novoAtendimento)
  };
}

// Garante que um atendimento salvo (mesmo antigo/incompleto) sempre tenha todos os campos esperados
function normalizarAtendimento(a){
  const base = novoAtendimento();
  if(!a || typeof a !== "object") return base;
  return {
    turno: typeof a.turno === "string" ? a.turno : base.turno,
    prontuario: typeof a.prontuario === "string" ? a.prontuario : base.prontuario,
    documento: typeof a.documento === "string" ? a.documento : base.documento,
    nascDiaMes: typeof a.nascDiaMes === "string" ? a.nascDiaMes : base.nascDiaMes,
    nascAno: typeof a.nascAno === "string" ? a.nascAno : base.nascAno,
    sexo: typeof a.sexo === "string" ? a.sexo : base.sexo,
    localAtendimento: typeof a.localAtendimento === "string" ? a.localAtendimento : base.localAtendimento,
    escutaInicial: !!a.escutaInicial,
    procedimentos: (a.procedimentos && typeof a.procedimentos === "object") ? a.procedimentos : {}
  };
}

function normalizarHeader(h){
  const base = estadoInicial().header;
  if(!h || typeof h !== "object") return base;
  const resultado = {};
  Object.keys(base).forEach(chave=>{
    resultado[chave] = typeof h[chave] === "string" ? h[chave] : base[chave];
  });
  return resultado;
}

let estado = carregarEstado();
let atual = 1;

function carregarEstado(){
  try{
    const bruto = localStorage.getItem(CHAVE_STORAGE);
    if(bruto){
      const salvo = JSON.parse(bruto);
      let atendimentos = Array.isArray(salvo.atendimentos) ? salvo.atendimentos : [];
      atendimentos = atendimentos.map(normalizarAtendimento);
      // Completa o array caso o total salvo seja menor que TOTAL_ATENDIMENTOS atual
      while(atendimentos.length < TOTAL_ATENDIMENTOS){
        atendimentos.push(novoAtendimento());
      }
      // Corta o array caso o total salvo seja maior (evita índices fora do range em relatórios)
      if(atendimentos.length > TOTAL_ATENDIMENTOS){
        atendimentos = atendimentos.slice(0, TOTAL_ATENDIMENTOS);
      }
      return {
        header: normalizarHeader(salvo.header),
        atendimentos: atendimentos
      };
    }
  }catch(e){ console.error("Estado salvo estava corrompido, reiniciando.", e); }
  return estadoInicial();
}

function salvarEstado(){
  try{
    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(estado));
  }catch(e){ console.error("Falha ao salvar", e); }
}

function atendimentoTemDados(a){
  if(!a) return false;
  if(a.turno||a.prontuario||a.documento||a.nascDiaMes||a.nascAno||a.sexo||a.localAtendimento||a.escutaInicial) return true;
  if(!a.procedimentos || typeof a.procedimentos !== "object") return false;
  return Object.values(a.procedimentos).some(v=>v);
}

// ---------- Cabeçalho ----------
const camposHeader = ["digitadoPor","dataDigitado","conferidoPor","folhaNo","cnsProfissional","cbo","cnes","ine","dataFicha"];
camposHeader.forEach(id=>{
  const el = document.getElementById(id);
  el.value = estado.header[id] || "";
  el.addEventListener("input", ()=>{ estado.header[id] = el.value; salvarEstado(); });
});

// ---------- Navegador de atendimentos ----------
function renderNav(){
  const nav = document.getElementById("navAtend");
  nav.innerHTML = "";
  for(let i=1;i<=TOTAL_ATENDIMENTOS;i++){
    const b = document.createElement("button");
    b.textContent = i;
    if(i===atual) b.classList.add("ativo");
    if(atendimentoTemDados(estado.atendimentos[i-1])) b.classList.add("preenchido");
    b.onclick = ()=>{ atual = i; renderNav(); renderAtendimento(); };
    nav.appendChild(b);
  }
  document.getElementById("statusAtend").textContent = `Atendimento ${atual} de ${TOTAL_ATENDIMENTOS}`;
}

// ---------- Radios turno/sexo ----------
function renderRadiosTurno(a){
  const div = document.getElementById("radiosTurno");
  div.innerHTML = "";
  [["M","Manhã"],["T","Tarde"],["N","Noite"]].forEach(([v,l])=>{
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="radio" name="turno" value="${v}" ${a.turno===v?"checked":""}> ${l}`;
    lab.querySelector("input").onchange = ()=>{ a.turno=v; salvarEstado(); renderNav(); };
    div.appendChild(lab);
  });
}
function renderRadiosSexo(a){
  const div = document.getElementById("radiosSexo");
  div.innerHTML = "";
  [["F","Feminino"],["M","Masculino"],["I","Indeterminado"]].forEach(([v,l])=>{
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="radio" name="sexo" value="${v}" ${a.sexo===v?"checked":""}> ${l}`;
    lab.querySelector("input").onchange = ()=>{ a.sexo=v; salvarEstado(); renderNav(); };
    div.appendChild(lab);
  });
}

// ---------- Formulário do atendimento ----------
function renderAtendimento(){
  const a = estado.atendimentos[atual-1];

  document.getElementById("prontuario").value = a.prontuario;
  document.getElementById("documento").value = a.documento;
  document.getElementById("nascDiaMes").value = a.nascDiaMes;
  document.getElementById("nascAno").value = a.nascAno;
  document.getElementById("localAtendimento").value = a.localAtendimento;
  document.getElementById("escutaInicial").checked = a.escutaInicial;

  renderRadiosTurno(a);
  renderRadiosSexo(a);

  const secoes = document.getElementById("secoesProcedimentos");
  secoes.innerHTML = "";
  Object.entries(PROCEDIMENTOS).forEach(([titulo, lista])=>{
    const fs = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = titulo;
    fs.appendChild(legend);
    lista.forEach(nome=>{
      const item = document.createElement("div");
      item.className = "check-item";
      const checked = !!a.procedimentos[nome];
      item.innerHTML = `<input type="checkbox" ${checked?"checked":""}> <span>${nome}</span>`;
      item.querySelector("input").onchange = (ev)=>{
        a.procedimentos[nome] = ev.target.checked;
        salvarEstado();
        renderNav();
        renderTotais();
      };
      fs.appendChild(item);
    });
    secoes.appendChild(fs);
  });
}

// ---------- Totais gerais (soma de cada procedimento em todos os atendimentos) ----------
function calcularTotais(){
  const totais = {};
  Object.entries(PROCEDIMENTOS).forEach(([titulo, lista])=>{
    totais[titulo] = {};
    lista.forEach(nome=>{ totais[titulo][nome] = 0; });
  });
  totais["Outros"] = { "Escuta inicial/orientação": 0 };

  estado.atendimentos.forEach(a=>{
    if(a.escutaInicial) totais["Outros"]["Escuta inicial/orientação"]++;
    Object.entries(PROCEDIMENTOS).forEach(([titulo, lista])=>{
      lista.forEach(nome=>{
        if(a.procedimentos[nome]) totais[titulo][nome]++;
      });
    });
  });
  return totais;
}

function renderTotais(){
  const totais = calcularTotais();
  const container = document.getElementById("totaisLista");
  container.innerHTML = "";
  Object.entries(totais).forEach(([titulo, itens])=>{
    const grupo = document.createElement("div");
    grupo.className = "totais-grupo";
    const h3 = document.createElement("h3");
    h3.textContent = titulo;
    grupo.appendChild(h3);
    Object.entries(itens).forEach(([nome, qtd])=>{
      const linha = document.createElement("div");
      linha.className = "totais-item";
      linha.innerHTML = `<span>${nome}</span><span class="qtd ${qtd===0?"zero":""}">${qtd}</span>`;
      grupo.appendChild(linha);
    });
    container.appendChild(grupo);
  });
}

function ligarCamposSimples(){
  const a = ()=> estado.atendimentos[atual-1];
  document.getElementById("prontuario").addEventListener("input", e=>{ a().prontuario=e.target.value; salvarEstado(); renderNav(); });
  document.getElementById("documento").addEventListener("input", e=>{ a().documento=e.target.value; salvarEstado(); renderNav(); });
  document.getElementById("nascDiaMes").addEventListener("input", e=>{ a().nascDiaMes=e.target.value; salvarEstado(); renderNav(); });
  document.getElementById("nascAno").addEventListener("input", e=>{ a().nascAno=e.target.value; salvarEstado(); renderNav(); });
  document.getElementById("localAtendimento").addEventListener("input", e=>{ a().localAtendimento=e.target.value; salvarEstado(); renderNav(); });
  document.getElementById("escutaInicial").addEventListener("change", e=>{ a().escutaInicial=e.target.checked; salvarEstado(); renderNav(); renderTotais(); });
}

// ---------- Histórico de fichas guardadas no aplicativo ----------
function carregarHistorico(){
  try{
    const bruto = localStorage.getItem(CHAVE_HISTORICO);
    if(bruto) return JSON.parse(bruto);
  }catch(e){}
  return [];
}

function salvarHistorico(lista){
  try{
    localStorage.setItem(CHAVE_HISTORICO, JSON.stringify(lista));
  }catch(e){ console.error("Falha ao salvar histórico", e); }
}

function guardarFichaAtual(){
  const historico = carregarHistorico();
  const dataFicha = (estado.header.dataFicha || "").trim() || "Sem data";
  const folhaNo = (estado.header.folhaNo || "").trim();

  const registro = {
    id: Date.now(),
    dataFicha: dataFicha,
    folhaNo: folhaNo,
    salvoEm: new Date().toISOString(),
    header: JSON.parse(JSON.stringify(estado.header)),
    atendimentos: JSON.parse(JSON.stringify(estado.atendimentos))
  };

  // Se já existir uma ficha guardada com a mesma Data da Ficha + Folha Nº, substitui (evita duplicar)
  const indiceExistente = historico.findIndex(f => f.dataFicha === dataFicha && f.folhaNo === folhaNo);
  if(indiceExistente >= 0){
    historico[indiceExistente] = registro;
  } else {
    historico.push(registro);
  }

  salvarHistorico(historico);
  renderHistorico();
}

function renderHistorico(){
  const historico = carregarHistorico();
  const container = document.getElementById("listaHistorico");
  container.innerHTML = "";

  if(historico.length === 0){
    container.innerHTML = `<div class="historico-vazio">Nenhuma ficha guardada ainda.</div>`;
    return;
  }

  // Ordena por Data da Ficha (mais recente primeiro), depois por folha
  const ordenado = [...historico].sort((a,b)=>{
    if(a.dataFicha === b.dataFicha) return (a.folhaNo||"").localeCompare(b.folhaNo||"");
    return b.dataFicha.localeCompare(a.dataFicha);
  });

  ordenado.forEach(registro=>{
    const linha = document.createElement("div");
    linha.className = "historico-item";
    linha.innerHTML = `
      <div class="historico-info">
        <b>${registro.dataFicha}</b>${registro.folhaNo ? " · Folha " + registro.folhaNo : ""}
      </div>
      <div class="historico-acoes">
        <button class="btn-abrir">Abrir</button>
        <button class="btn-excluir">Excluir</button>
      </div>
    `;
    linha.querySelector(".btn-abrir").onclick = ()=> abrirFicha(registro.id);
    linha.querySelector(".btn-excluir").onclick = ()=> excluirFicha(registro.id);
    container.appendChild(linha);
  });
}

function abrirFicha(idFicha){
  if(!confirm("Vou guardar automaticamente o que está preenchido agora antes de trocar. Continuar?")) return;

  // Guarda o progresso atual primeiro, pra não perder nada que não foi salvo ainda
  guardarFichaAtual();

  const historico = carregarHistorico();
  const registro = historico.find(f=>f.id===idFicha);
  if(!registro) return;

  let atendimentos = Array.isArray(registro.atendimentos) ? registro.atendimentos.map(normalizarAtendimento) : [];
  while(atendimentos.length < TOTAL_ATENDIMENTOS){
    atendimentos.push(novoAtendimento());
  }
  if(atendimentos.length > TOTAL_ATENDIMENTOS){
    atendimentos = atendimentos.slice(0, TOTAL_ATENDIMENTOS);
  }

  estado = {
    header: normalizarHeader(registro.header),
    atendimentos: atendimentos
  };

  camposHeader.forEach(campoId=>{
    document.getElementById(campoId).value = estado.header[campoId] || "";
  });

  atual = 1;
  salvarEstado();
  renderNav();
  renderAtendimento();
  renderTotais();
}

function excluirFicha(id){
  if(!confirm("Excluir esta ficha guardada? Essa ação não pode ser desfeita.")) return;
  let historico = carregarHistorico();
  historico = historico.filter(f=>f.id!==id);
  salvarHistorico(historico);
  renderHistorico();
}

function salvarComConfirmacao(){
  salvarEstado();
  guardarFichaAtual();
  const aviso = document.getElementById("avisoSalvo");
  aviso.textContent = "Ficha guardada no aplicativo ✓";
  aviso.classList.add("mostrar");
  setTimeout(()=> aviso.classList.remove("mostrar"), 1800);
}

function limparTudo(){
  if(!confirm("Isso vai apagar todos os dados preenchidos nesta ficha. Continuar?")) return;
  estado = estadoInicial();
  camposHeader.forEach(id=> document.getElementById(id).value = "");
  atual = 1;
  salvarEstado();
  renderNav();
  renderAtendimento();
  renderTotais();
}

// ---------- Exportar Excel ----------
function exportarExcel(){
  const linhas = [];
  linhas.push(["FICHA DE PROCEDIMENTOS - e-SUS AB"]);
  linhas.push(["Digitado por", estado.header.digitadoPor, "Data", estado.header.dataDigitado]);
  linhas.push(["Conferido por", estado.header.conferidoPor, "Folha Nº", estado.header.folhaNo]);
  linhas.push(["CNS Profissional", estado.header.cnsProfissional, "CBO", estado.header.cbo, "CNES", estado.header.cnes, "INE", estado.header.ine, "Data", estado.header.dataFicha]);
  linhas.push([]);

  const cabecalho = ["Item", ...estado.atendimentos.map((_,i)=>`Atend. ${i+1}`)];
  linhas.push(cabecalho);
  linhas.push(["Turno", ...estado.atendimentos.map(a=>a.turno)]);
  linhas.push(["Nº Prontuário", ...estado.atendimentos.map(a=>a.prontuario)]);
  linhas.push(["CNS/CPF", ...estado.atendimentos.map(a=>a.documento)]);
  linhas.push(["Nascimento (dia/mês)", ...estado.atendimentos.map(a=>a.nascDiaMes)]);
  linhas.push(["Ano nascimento", ...estado.atendimentos.map(a=>a.nascAno)]);
  linhas.push(["Sexo", ...estado.atendimentos.map(a=>a.sexo)]);
  linhas.push(["Local de atendimento", ...estado.atendimentos.map(a=>a.localAtendimento)]);
  linhas.push(["Escuta inicial/orientação", ...estado.atendimentos.map(a=>a.escutaInicial?"X":"")]);

  Object.entries(PROCEDIMENTOS).forEach(([titulo, lista])=>{
    linhas.push([titulo]);
    lista.forEach(nome=>{
      linhas.push([nome, ...estado.atendimentos.map(a=>a.procedimentos[nome]?"X":"")]);
    });
  });

  linhas.push([]);
  linhas.push(["TOTAIS GERAIS (soma de todos os atendimentos)"]);
  const totais = calcularTotais();
  Object.entries(totais).forEach(([titulo, itens])=>{
    linhas.push([titulo]);
    Object.entries(itens).forEach(([nome, qtd])=>{
      linhas.push([nome, qtd]);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(linhas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ficha");
  const nomeArquivo = `ficha-procedimentos-folha${estado.header.folhaNo||"sn"}.xlsx`;
  XLSX.writeFile(wb, nomeArquivo);
}

// ---------- Baixar exatamente a tela atual (sem reformatar) ----------
function baixarTelaAtual(){
  const alvo = document.querySelector(".container");
  html2canvas(alvo, { scale:2, backgroundColor:"#ffffff" }).then(canvas=>{
    const { jsPDF } = window.jspdf;
    const larguraImg = canvas.width;
    const alturaImg = canvas.height;
    const doc = new jsPDF({
      orientation: larguraImg > alturaImg ? "landscape" : "portrait",
      unit:"px",
      format:[larguraImg, alturaImg]
    });
    doc.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, larguraImg, alturaImg);
    doc.save(`ficha-atendimento-${atual}.pdf`);
  }).catch(err=>{
    alert("Não foi possível gerar o PDF da tela. Detalhe: " + err);
  });
}

// ---------- Gerar PDF (montado direto com jsPDF, sem depender da impressão do Android) ----------
function gerarPDF(){
  const h = estado.header;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"landscape", unit:"pt", format:"a4" });

  doc.setFontSize(13);
  doc.text("FICHA DE PROCEDIMENTOS - e-SUS AB", 20, 25);
  doc.setFontSize(8);
  doc.text(
    `Digitado por: ${h.digitadoPor||""}   Data: ${h.dataDigitado||""}   Conferido por: ${h.conferidoPor||""}   Folha Nº: ${h.folhaNo||""}`,
    20, 38
  );
  doc.text(
    `CNS Profissional: ${h.cnsProfissional||""}   CBO: ${h.cbo||""}   CNES: ${h.cnes||""}   INE: ${h.ine||""}   Data: ${h.dataFicha||""}`,
    20, 48
  );

  const colunas = ["Item", ...estado.atendimentos.map((_,i)=>String(i+1))];
  const linhas = [];
  linhas.push(["Turno", ...estado.atendimentos.map(a=>a.turno||"")]);
  linhas.push(["Nº Prontuário", ...estado.atendimentos.map(a=>a.prontuario||"")]);
  linhas.push(["CNS/CPF", ...estado.atendimentos.map(a=>a.documento||"")]);
  linhas.push(["Nascimento", ...estado.atendimentos.map(a=>`${a.nascDiaMes||""}/${a.nascAno||""}`)]);
  linhas.push(["Sexo", ...estado.atendimentos.map(a=>a.sexo||"")]);
  linhas.push(["Local", ...estado.atendimentos.map(a=>a.localAtendimento||"")]);
  linhas.push(["Escuta inicial", ...estado.atendimentos.map(a=>a.escutaInicial?"X":"")]);

  Object.entries(PROCEDIMENTOS).forEach(([titulo, lista])=>{
    linhas.push([{content:titulo, colSpan:colunas.length, styles:{fillColor:[234,243,252], fontStyle:"bold", halign:"left"}}]);
    lista.forEach(nome=>{
      linhas.push([nome, ...estado.atendimentos.map(a=>a.procedimentos[nome]?"X":"")]);
    });
  });

  doc.autoTable({
    head:[colunas],
    body:linhas,
    startY:56,
    styles:{ fontSize:6, cellPadding:2, halign:"center" },
    columnStyles:{ 0:{ halign:"left", cellWidth:110 } },
    headStyles:{ fillColor:[11,92,171] }
  });

  const totais = calcularTotais();
  const linhasTotais = [];
  Object.entries(totais).forEach(([titulo, itens])=>{
    linhasTotais.push([{content:titulo, colSpan:2, styles:{fillColor:[234,243,252], fontStyle:"bold", halign:"left"}}]);
    Object.entries(itens).forEach(([nome, qtd])=>{
      linhasTotais.push([nome, String(qtd)]);
    });
  });

  doc.autoTable({
    head:[["Totais Gerais", "Qtd"]],
    body:linhasTotais,
    startY: doc.lastAutoTable.finalY + 15,
    styles:{ fontSize:7, cellPadding:3, halign:"center" },
    columnStyles:{ 0:{ halign:"left", cellWidth:250 } },
    headStyles:{ fillColor:[11,92,171] }
  });

  const nomeArquivo = `ficha-procedimentos-folha${h.folhaNo||"sn"}.pdf`;
  doc.save(nomeArquivo);
}
